server {
    # 8080, because the container runs unprivileged.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames, so they are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: the OIDC redirect lands on a client-side route.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
    }
}
