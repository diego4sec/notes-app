# Shared defaults. Pick an environment file on top:
#   helm upgrade --install notes ./deploy/chart -f deploy/chart/values-local.yaml
#   helm upgrade --install notes ./deploy/chart -f deploy/chart/values-cloud.yaml

# One host serves web, api and keycloak. That is what keeps the token issuer
# identical for the browser and the API, and removes CORS entirely.
#
# *.localhost, not *.localtest.me, and that is load-bearing: Keycloak sets its
# auth cookies Secure, and browsers only accept Secure cookies on a trustworthy
# origin. http://*.localhost qualifies, http://*.localtest.me does not, so the
# latter gives you a silent login loop with TLS off.
host: notes.localhost

# Port the browser will use, when it is not the scheme default. Leave empty for
# 80/443. Set it when reaching the ingress through a port-forward, because it
# has to appear in the token issuer as well as in the URL bar.
port: ""

ingress:
  className: nginx
  annotations: {}

tls:
  enabled: false
  secretName: notes-tls
  # cert-manager ClusterIssuer. Empty means bring your own secret.
  clusterIssuer: ""

realm: notes

# Images published by each repo's build workflow. `main` follows the branch;
# pin a `sha-<short>` or a released version for anything you care about, because
# a moving tag means a cluster can run something other than what you deployed.
#
# GHCR packages are private until you make them public. If they are private, the
# cluster needs a pull secret:
#
#   kubectl -n notes create secret docker-registry ghcr \
#     --docker-server=ghcr.io --docker-username=<user> --docker-password=<PAT with read:packages>
#
# then list it here.
imagePullSecrets: []

api:
  image: ghcr.io/diego4sec/notes-api:main
  pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 192Mi }

web:
  image: ghcr.io/diego4sec/notes-web:main
  pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 32Mi }

keycloak:
  image: ghcr.io/diego4sec/keycloak-notes:main
  pullPolicy: IfNotPresent
  replicas: 1
  # --import-realm only applies when the realm does not exist, so leaving this
  # on in a real environment gives you a realm nothing tracks. See README.
  importRealm: true
  adminUsername: admin
  resources:
    requests: { cpu: 200m, memory: 768Mi }

postgres:
  # true: in-cluster StatefulSet, fine for Docker Desktop.
  # false: managed database, set host below.
  enabled: true
  image: postgres:16-alpine
  host: ""
  port: 5432
  user: notes
  notesDatabase: notes
  keycloakDatabase: keycloak
  storage: 5Gi
  storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 192Mi }

secret:
  # true: the chart creates the secret from the two passwords below.
  # false: you supply the secret yourself (External Secrets, SOPS,
  #   sealed-secrets) with keys `db-password` and `keycloak-admin-password`.
  #   This is the right answer for anything real, so the operator owns rotation.
  create: true
  name: ""

  # REQUIRED when create is true. Both must be non-empty: the chart refuses to
  # render otherwise, rather than substituting something you did not choose.
  #
  # Do NOT fill them in here. This file is committed, and this repo is public,
  # so a value written here is a published password. Supply them from outside
  # the repo instead, in order of preference:
  #
  #   1. make secrets      writes deploy/chart/secrets.local.yaml (gitignored)
  #                        with random values, which `make deploy` passes via -f
  #   2. --set secret.dbPassword=...      for one-off runs
  #   3. secret.create=false              for anything real: the secret comes
  #                                       from a secret store and rotation is
  #                                       the operator's, not the chart's
  #
  # Changing dbPassword after the first install does not change the database.
  # Postgres only applies POSTGRES_PASSWORD at initdb, so a rotation needs an
  # ALTER USER as well, or the API cannot connect.
  dbPassword: ""
  keycloakAdminPassword: ""
