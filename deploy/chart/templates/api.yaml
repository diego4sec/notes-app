apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "notes.labels" . | nindent 4 }}
spec:
  ports:
    - { name: http, port: 8000, targetPort: http }
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "notes.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "notes.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: {{ .Values.api.image }}
          imagePullPolicy: {{ .Values.api.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            # DB_PASSWORD must come FIRST: Kubernetes only expands $(VAR)
            # references to variables declared earlier in the list.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "notes.secretName" . }}
                  key: db-password
            # The password is interpolated into a URL, so keep it free of
            # characters that need percent-encoding (@ : / ? #).
            - name: DATABASE_URL
              value: postgresql+psycopg://{{ .Values.postgres.user }}:$(DB_PASSWORD)@{{ include "notes.dbHost" . }}:{{ .Values.postgres.port }}/{{ .Values.postgres.notesDatabase }}

            # The public issuer, which is what lands in the token.
            - { name: OIDC_ISSUER, value: {{ include "notes.issuer" . | quote }} }
            # Keys are fetched in-cluster, so JWKS does not depend on the
            # ingress being reachable from inside the cluster.
            - name: OIDC_JWKS_URL
              value: http://{{ .Release.Name }}-keycloak:8080/auth/realms/{{ .Values.realm }}/protocol/openid-connect/certs
            - { name: OIDC_AUDIENCE, value: notes-api }
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on, and anything Python touches at
            # runtime lands in /tmp.
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
