{{- if gt (int .Values.keycloak.replicas) 1 }}
# Headless, and it must publish not-ready addresses: a starting pod has to find
# its peers before it can become ready.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-keycloak-headless
  labels: {{- include "notes.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - { name: jgroups, port: 7800 }
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: keycloak
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-keycloak
  labels: {{- include "notes.labels" . | nindent 4 }}
spec:
  ports:
    - { name: http, port: 8080, targetPort: http }
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-keycloak
  labels: {{- include "notes.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.keycloak.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: keycloak
  template:
    metadata:
      labels:
        {{- include "notes.labels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          imagePullPolicy: {{ .Values.keycloak.pullPolicy }}
          # --optimized, because kc.sh build already ran at image build time.
          # start-dev is never used here.
          args:
            - start
            - --optimized
            {{- if .Values.keycloak.importRealm }}
            - --import-realm
            {{- end }}
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL_HOST, value: {{ include "notes.dbHost" . | quote }} }
            - { name: KC_DB_URL_PORT, value: {{ .Values.postgres.port | quote }} }
            - { name: KC_DB_URL_DATABASE, value: {{ .Values.postgres.keycloakDatabase | quote }} }
            - { name: KC_DB_USERNAME, value: {{ .Values.postgres.user | quote }} }
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "notes.secretName" . }}
                  key: db-password

            # Pin the public URL so the issuer in every token matches what the
            # browser used. Without this, tokens are issued with the pod's own
            # address and the API rejects them.
            # Includes the /auth path: KC_HOSTNAME sets the entire public base
            # URL, and dropping the path makes Keycloak advertise an issuer
            # that does not match where it actually serves.
            - { name: KC_HOSTNAME, value: "{{ include "notes.publicUrl" . }}/auth" }
            # TLS terminates at the ingress, so the pod speaks plain HTTP but
            # must trust the forwarded scheme to build correct redirect URLs.
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }

            {{- if gt (int .Values.keycloak.replicas) 1 }}
            # Clustered sessions. The kubernetes stack is JGroups DNS_PING, which
            # discovers peers through the headless Service below. No pod-listing
            # RBAC and no multicast, neither of which vanilla k8s gives you.
            - { name: KC_CACHE, value: ispn }
            - { name: KC_CACHE_STACK, value: kubernetes }
            - name: JAVA_OPTS_APPEND
              value: -Djgroups.dns.query={{ .Release.Name }}-keycloak-headless.{{ .Release.Namespace }}.svc.cluster.local
            {{- else }}
            # Single replica: no cluster to join, and an in-memory cache avoids
            # a JGroups stack that would only ever find itself.
            - { name: KC_CACHE, value: local }
            {{- end }}

            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: {{ .Values.keycloak.adminUsername | quote }} }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "notes.secretName" . }}
                  key: keycloak-admin-password
          ports:
            - { name: http, containerPort: 8080 }
            # Health and metrics live on the management port, and are not
            # behind KC_HTTP_RELATIVE_PATH.
            - { name: management, containerPort: 9000 }
            {{- if gt (int .Values.keycloak.replicas) 1 }}
            - { name: jgroups, containerPort: 7800 }
            {{- end }}
          # Health lives under /auth on the management port: Keycloak's
          # http-management-relative-path defaults to http-relative-path, which
          # the image bakes as /auth. Probing /health/* returns 404, and the
          # liveness probe then kills a Keycloak that started perfectly.
          #
          # A startupProbe carries the slow first boot (schema creation on an
          # empty database), so liveness cannot fire before Keycloak is up.
          startupProbe:
            httpGet: { path: /auth/health/started, port: management }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /auth/health/ready, port: management }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /auth/health/live, port: management }
            periodSeconds: 30
            timeoutSeconds: 3
          resources: {{- toYaml .Values.keycloak.resources | nindent 12 }}
