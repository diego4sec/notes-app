{{- if .Values.secret.create }}
{{- if or (empty .Values.secret.dbPassword) (empty .Values.secret.keycloakAdminPassword) }}
{{- fail "secret.create is true but secret.dbPassword / secret.keycloakAdminPassword are empty. Set them (local only) or set secret.create=false and supply the secret from a real store." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notes.secretName" . }}
  labels: {{- include "notes.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ .Values.secret.dbPassword | quote }}
  keycloak-admin-password: {{ .Values.secret.keycloakAdminPassword | quote }}
{{- end }}
