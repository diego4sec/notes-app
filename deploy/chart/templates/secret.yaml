{{- if .Values.secret.create }}

{{/*
Both passwords are required. Empty is rejected rather than quietly filled in,
so there is never a doubt about what a deployment is running with.

They must not come from a committed file. `make secrets` writes
deploy/chart/secrets.local.yaml, which is gitignored, and `make deploy` passes
it with -f. For anything real, set secret.create=false and bring the secret
from a secret store instead.
*/}}
{{- if empty .Values.secret.dbPassword }}
{{- fail "secret.dbPassword is empty and must not be. Run `make secrets` to write deploy/chart/secrets.local.yaml (gitignored), pass --set secret.dbPassword=..., or set secret.create=false and supply the secret yourself." }}
{{- end }}
{{- if empty .Values.secret.keycloakAdminPassword }}
{{- fail "secret.keycloakAdminPassword is empty and must not be. Run `make secrets` to write deploy/chart/secrets.local.yaml (gitignored), pass --set secret.keycloakAdminPassword=..., or set secret.create=false and supply the secret yourself." }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notes.secretName" . }}
  labels: {{- include "notes.labels" . | nindent 4 }}
  annotations:
    # Survives `helm uninstall`, because the Postgres PVC does too and the two
    # have to keep agreeing on the password.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  db-password: {{ .Values.secret.dbPassword | quote }}
  keycloak-admin-password: {{ .Values.secret.keycloakAdminPassword | quote }}
{{- end }}
