# Kubernetes on Docker Desktop.
#
# notes.localhost resolves to 127.0.0.1 with no /etc/hosts edit, and browsers
# treat *.localhost as a trustworthy origin, which is what lets Keycloak's
# Secure auth cookies work without TLS. Do not swap in a localtest.me-style
# domain here: the cookies get dropped and login loops with no error.
#
# Prerequisite:
#   helm upgrade --install ingress-nginx ingress-nginx \
#     --repo https://kubernetes.github.io/ingress-nginx \
#     --namespace ingress-nginx --create-namespace

host: notes.localhost

# 90, because port 80 on this cluster belongs to another app's LoadBalancer
# Service. Install the controller to match (`make ingress` does this):
#
#   --set controller.service.ports.http=90
#
# A LoadBalancer Service asking for a port that is already taken on the host
# never gets an address: it sits at <pending> and nothing answers. The port also
# has to appear here, because it lands in the token issuer as well as the URL.
# Set this to "" if your controller serves plain 80.
port: "90"

tls:
  enabled: false

postgres:
  enabled: true
  storage: 2Gi

secret:
  # Deliberately still empty here, and the chart will refuse to render until
  # something supplies them. `make secrets` writes random values to
  # deploy/chart/secrets.local.yaml, which is gitignored, and `make deploy`
  # passes it with -f.
  #
  # Read back what is in the cluster with:
  #
  #   kubectl -n notes get secret notes-secrets \
  #     -o jsonpath='{.data.keycloak-admin-password}' | base64 -d
  create: true
  dbPassword: ""
  keycloakAdminPassword: ""

# Local overrides the GHCR defaults in values.yaml with a throwaway registry on
# the host, so the inner loop does not depend on CI or on the network.
#
# The registry is not optional. Docker Desktop runs Kubernetes on containerd,
# which does NOT share the Docker daemon's image store, so `pullPolicy: Never`
# on a locally built image gives ErrImageNeverPull. `make registry` handles it.
#
# localhost:5001 resolves inside the cluster because Docker Desktop publishes
# container ports on the same VM the node runs in.
#
# To run the CI-built images here instead, drop these three overrides and, if
# the GHCR packages are private, add a pull secret.
api:
  image: localhost:5001/notes-api:dev
  pullPolicy: IfNotPresent

web:
  image: localhost:5001/notes-web:dev
  pullPolicy: IfNotPresent

keycloak:
  image: localhost:5001/keycloak-notes:dev
  pullPolicy: IfNotPresent
  importRealm: true
  replicas: 1
